name: Build Mexican Spanish dictionary website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/site_export.rs"
      - "src/evidence.rs"
      - "src/lexical.rs"
      - "src/corpus_load.rs"
      - "src/corpus.rs"
      - "src/main.rs"
      - "tests/site-search.test.mjs"
      - "corpus/**"
      - "evidence/**"
      - "Cargo.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mexilex-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate website JavaScript
        run: |
          node --check site/app.js
          node --test tests/site-search.test.mjs
      - name: Build prefix search index from committed lexical data
        run: cargo run --release -- build-site corpus data/site "$GITHUB_SHA"
      - name: Verify index and deployment footprint
        run: |
          test -s data/site/index.html
          test -s data/site/favicon.svg
          test -s data/site/flag-license.txt
          test -s data/site/mexico-frequency-license.txt
          node -e 'const m=require("./data/site/config.json"); if(m.mexico_dialogue_headwords < 10000) process.exit(1)'
          grep -q "mexico-hero-flag" data/site/index.html
          grep -q "mexico-tricolor-ribbon" data/site/index.html
          test -s data/site/config.json
          test -s data/site/mexico.json
          test -s data/site/index/ba.json
          test -s data/site/forms/ca.json
          grep -q '"banqueta"' data/site/index/ba.json
          test "$(find data/site/index -name '*.json' | wc -l)" -gt 50
          bytes="$(du -sb data/site | cut -f1)"
          echo "Built website: $bytes bytes"
          test "$bytes" -lt 500000000
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexilex-static-dictionary
          path: data/site/
          if-no-files-found: error
          retention-days: 7
      - name: Package site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: data/site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
