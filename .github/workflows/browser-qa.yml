name: Browser QA of public Mexican Spanish dictionary

on:
  workflow_run:
    workflows:
      - "Build Mexican Spanish dictionary website"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Chromium is installed
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "::error::Chromium unavailable on runner"
            exit 1
          fi
      - name: Exercise actual live desktop and mobile UI with no mocks
        run: node scripts/site-browser-smoke.mjs
