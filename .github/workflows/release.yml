name: Package versioned lexical release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/release-intents/lex-v0.1.0.txt"
      - ".github/release-intents/lex-v0.2.0.txt"
      - ".github/release-intents/lex-v0.3.0.txt"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        type: string
        required: true
      publish:
        description: "Publish GitHub release (false creates preview artifact only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: mexilex-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: "${{ inputs.version || (github.event_name == 'push' && github.event.head_commit.message == 'release: publish lex-v0.3.0' && '0.3.0') || (github.event_name == 'push' && github.event.head_commit.message == 'release: publish lex-v0.2.0' && '0.2.0') || '0.1.0' }}"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be numeric semver: 0.1.0"
            exit 1
          fi
      - name: Verify code and study migration tests before packaging
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Build database and trainer data from Git-tracked corpus
        run: |
          cargo run --release -- build-from-corpus corpus data/mexilex.sqlite
          cargo run --release -- export-study corpus data/study.jsonl
          cargo run --release -- export-study corpus data/mexico-labeled.jsonl --mexico-only
          test -s data/mexilex.sqlite
          test -s evidence/activ-es-v02.manifest.json
          test "$(wc -l < data/study.jsonl)" -gt 100000
          test "$(wc -l < data/mexico-labeled.jsonl)" -gt 1000
      - name: Package source metadata, licensing, and data
        run: |
          mkdir -p data/release/sqlite data/release/study dist
          cp data/mexilex.sqlite data/release/sqlite/mexilex.sqlite
          cp data/study.jsonl data/release/study/study.jsonl
          cp data/mexico-labeled.jsonl data/release/study/mexico-labeled.jsonl
          cp evidence/activ-es-v02.jsonl data/release/study/mexico-dialogue-frequency.jsonl
          cp evidence/activ-es-v02.manifest.json data/release/study/mexico-dialogue-frequency-manifest.json
          cp evidence/ACTIV-ES-LICENSE data/release/study/ACTIV-ES-LICENSE
          cp evidence/eswiktionary-mexico.jsonl data/release/study/wikcionario-mexico.jsonl
          cp evidence/eswiktionary-mexico.manifest.json data/release/study/wikcionario-mexico-manifest.json
          cp evidence/WIKCIONARIO-SOURCE.md data/release/study/WIKCIONARIO-SOURCE.md
          cp evidence/ciempiess-light-frequency.jsonl data/release/study/mexico-radio-frequency.jsonl
          cp evidence/ciempiess-light-frequency.manifest.json data/release/study/mexico-radio-frequency-manifest.json
          cp evidence/CIEMPIESS-SOURCE.md data/release/study/CIEMPIESS-SOURCE.md
          for folder in sqlite study; do
            cp CORPUS-LICENSE.md "data/release/$folder/CORPUS-LICENSE.md"
            cp corpus/manifest.json "data/release/$folder/source-manifest.json"
            cp corpus/upstream.sha256 "data/release/$folder/upstream.sha256"
            printf '{"format_version":1,"project":"mexilex","version":"%s","source_git_commit":"%s","lexical_language":"es-MX","definition_language":"en","content_license":"See CORPUS-LICENSE.md"}\n' "$VERSION" "$GITHUB_SHA" > "data/release/$folder/release-manifest.json"
          done
          tar -czf "dist/mexilex-sqlite-v$VERSION.tar.gz" -C data/release/sqlite .
          tar -czf "dist/mexilex-study-v$VERSION.tar.gz" -C data/release/study .
          (
            cd dist
            sha256sum "mexilex-sqlite-v$VERSION.tar.gz" "mexilex-study-v$VERSION.tar.gz" > SHA256SUMS
          )
          test -s dist/SHA256SUMS
          (
            cd dist
            sha256sum --check SHA256SUMS
            tar -tzf "mexilex-sqlite-v$VERSION.tar.gz" | grep -q '/mexilex.sqlite'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/study.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/mexico-labeled.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/mexico-dialogue-frequency.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/ACTIV-ES-LICENSE'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/wikcionario-mexico.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/WIKCIONARIO-SOURCE.md'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/mexico-radio-frequency.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q '/CIEMPIESS-SOURCE.md'
          )
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: mexilex-release-preview
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Publish permanent release assets
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.event.head_commit.message == 'release: publish lex-v0.1.0' || github.event.head_commit.message == 'release: publish lex-v0.2.0' || github.event.head_commit.message == 'release: publish lex-v0.3.0')) }}"
        run: |
          cat > data/release-notes.md <<EOF
          Source: English Wiktionary Spanish via Kaikki/Wiktextract.
          Lexical target: es-MX. Definition language: en.
          Source commit: $GITHUB_SHA.

          The SQLite archive contains a generated database; the study archive
          contains stateless headword-oriented vocabulary, Mexico-labeled entries,
          a separate GPL-2.0 ACTIV-ES Mexican film-dialogue frequency sidecar,
          and independently tagged Spanish Wiktionary (Wikcionario) Mexico-word
          evidence licensed under CC BY-SA/GFDL, plus independently licensed
          CC BY-SA 4.0 aggregate Mexican radio-conversation frequency evidence
          derived from CIEMPIESS LIGHT. These sources do not change the
          English-Wiktionary senses or claim regional semantic exclusivity.
          See CORPUS-LICENSE.md in each archive for upstream licensing.
          Do not erase trainer review history when changing dictionary snapshots;
          use the compare-study reconciliation command first.
          EOF
          gh release create "lex-v$VERSION" \
            "dist/mexilex-sqlite-v$VERSION.tar.gz" \
            "dist/mexilex-study-v$VERSION.tar.gz" \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Mexilex lexical snapshot v$VERSION" \
            --notes-file data/release-notes.md
      - name: Verify public release assets after publication
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.event.head_commit.message == 'release: publish lex-v0.1.0' || github.event.head_commit.message == 'release: publish lex-v0.2.0' || github.event.head_commit.message == 'release: publish lex-v0.3.0')) }}"
        run: |
          mkdir -p data/published-release
          gh release download "lex-v$VERSION" --repo "$GITHUB_REPOSITORY" --dir data/published-release
          (
            cd data/published-release
            sha256sum --check SHA256SUMS
            test -s "mexilex-sqlite-v$VERSION.tar.gz"
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q 'wikcionario-mexico.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q 'WIKCIONARIO-SOURCE.md'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q 'mexico-radio-frequency.jsonl'
            tar -tzf "mexilex-study-v$VERSION.tar.gz" | grep -q 'CIEMPIESS-SOURCE.md'
          )
          mkdir -p data/published-study
          tar -xzf "data/published-release/mexilex-study-v$VERSION.tar.gz" -C data/published-study
          test "$(wc -l < data/published-study/wikcionario-mexico.jsonl)" -eq 1946
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const folder = 'data/published-study/';
          const manifest = JSON.parse(fs.readFileSync(folder + 'release-manifest.json', 'utf8'));
          const regional = JSON.parse(fs.readFileSync(folder + 'wikcionario-mexico-manifest.json', 'utf8'));
          assert.equal(manifest.lexical_language, 'es-MX');
          assert.equal(manifest.definition_language, 'en');
          assert.equal(regional.source_senses, 2304);
          assert.equal(regional.matched_spellings, 1235);
          assert.equal(regional.distinct_word_pos, 1946);
          const radio = JSON.parse(fs.readFileSync(folder + "mexico-radio-frequency-manifest.json", "utf8"));
          assert.equal(radio.utterances, 16663);
          assert.equal(radio.token_total, 167118);
          assert.equal(radio.published_surface_tokens, 6250);
          assert.equal(radio.license, "CC BY-SA 4.0; see CIEMPIESS-SOURCE.md");
          const speech = fs.readFileSync(folder + "mexico-radio-frequency.jsonl", "utf8").trimEnd().split('\n').map(JSON.parse);
          assert.equal(speech.length, 6250);
          assert.deepEqual(speech.find(row => row[0] === "casa"), ["casa", 43, 42]);
          const rows = fs.readFileSync(folder + 'wikcionario-mexico.jsonl', 'utf8').trimEnd().split('\n').map(JSON.parse);
          assert.ok(rows.every(row => Array.isArray(row) && row.length === 4 && typeof row[3] === 'boolean'));
          assert.ok(rows.some(row => row[0] === 'banqueta' && row[3] === true));
          assert.ok(rows.every(row => !('review_history' in row)));
          console.log('Public ' + manifest.version + ' release verified with separate Wikcionario Mexico evidence');
          NODE
