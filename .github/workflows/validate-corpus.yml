name: Validate committed lexical corpus

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-corpus.yml
      - src/**
      - Cargo.toml
      - corpus/**
      - scripts/simulate-snapshot-upgrade.mjs
      - evidence/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local search database from the Git versioned corpus
        run: |
          test -s corpus/manifest.json
          cargo run --release -- build-from-corpus corpus data/rebuilt.sqlite
          cargo run --release -- stats data/rebuilt.sqlite
          cargo run --release -- lookup data/rebuilt.sqlite banqueta
      - name: Ensure database is actually populated
        run: |
          test -s data/rebuilt.sqlite
          test "$(stat -c%s data/rebuilt.sqlite)" -gt 1000000
      - name: Export real study entries without downloading upstream again
        run: |
          cargo run --release -- export-study corpus data/study.jsonl
          test -s data/study.jsonl
          test "$(wc -l < data/study.jsonl)" -gt 100000
          grep -q '"word":"banqueta"' data/study.jsonl
          cargo run --release -- export-study corpus data/mexican-study.jsonl --mexico-only
          test "$(wc -l < data/mexican-study.jsonl)" -gt 1000
      - name: Verify conservative cross-snapshot identity on full corpus
        run: |
          cargo run --release -- compare-study data/study.jsonl data/study.jsonl data/self-compare.jsonl
          test "$(wc -l < data/self-compare.jsonl)" -eq "$(wc -l < data/study.jsonl)"
          ! grep -q '"status":"candidate_review"' data/self-compare.jsonl
          ! grep -q '"status":"ambiguous"' data/self-compare.jsonl
          ! grep -q '"status":"missing"' data/self-compare.jsonl
      - name: Simulate a changed full-corpus study snapshot without touching the source
        run: |
          node scripts/simulate-snapshot-upgrade.mjs data/study.jsonl data/revised-simulated.jsonl
          cargo run --release -- compare-study data/study.jsonl data/revised-simulated.jsonl data/reconciliation-simulated.jsonl | tee data/reconciliation-stats.txt
          test "$(wc -l < data/reconciliation-simulated.jsonl)" -eq "$(wc -l < data/study.jsonl)"
          grep -q 'changed_definitions: 1' data/reconciliation-stats.txt
          grep -q 'changed_annotations: 1' data/reconciliation-stats.txt
          grep -q 'changed_forms: 1' data/reconciliation-stats.txt
          grep -q 'added_senses: 1' data/reconciliation-stats.txt
          grep -q 'missing: 1' data/reconciliation-stats.txt
          grep -q '"requires_review":true' data/reconciliation-simulated.jsonl
          grep -q '"requires_review":false' data/reconciliation-simulated.jsonl
          test "$(wc -l < data/revised-simulated.jsonl)" -eq "$(($(wc -l < data/study.jsonl) - 1))"
      - name: Package verified study exports with source and checksums
        run: |
          mkdir -p data/study-package
          cp data/study.jsonl data/study-package/study.jsonl
          cp data/mexican-study.jsonl data/study-package/mexico-labeled.jsonl
          cp CORPUS-LICENSE.md data/study-package/CORPUS-LICENSE.md
          cp evidence/activ-es-v02.jsonl data/study-package/mexico-dialogue-frequency.jsonl
          cp evidence/activ-es-v02.manifest.json data/study-package/mexico-dialogue-frequency-manifest.json
          cp evidence/ACTIV-ES-LICENSE data/study-package/ACTIV-ES-LICENSE
          cp evidence/eswiktionary-mexico.jsonl data/study-package/wikcionario-mexico.jsonl
          cp evidence/eswiktionary-mexico.manifest.json data/study-package/wikcionario-mexico-manifest.json
          cp evidence/WIKCIONARIO-SOURCE.md data/study-package/WIKCIONARIO-SOURCE.md
          cp evidence/ciempiess-light-frequency.jsonl data/study-package/mexico-radio-frequency.jsonl
          cp evidence/ciempiess-light-frequency.manifest.json data/study-package/mexico-radio-frequency-manifest.json
          cp evidence/CIEMPIESS-SOURCE.md data/study-package/CIEMPIESS-SOURCE.md
          printf '{"format_version":1,"source":"mexilex","source_git_commit":"%s","lexical_language":"es-MX","definition_language":"en","export_kind":"study-entries","default_excludes_pure_inflections":true}\n' "$GITHUB_SHA" > data/study-package/manifest.json
          (
            cd data/study-package
            sha256sum study.jsonl mexico-labeled.jsonl mexico-dialogue-frequency.jsonl mexico-dialogue-frequency-manifest.json wikcionario-mexico.jsonl wikcionario-mexico-manifest.json mexico-radio-frequency.jsonl mexico-radio-frequency-manifest.json manifest.json > SHA256SUMS
          )
          test "$(wc -l < data/study-package/study.jsonl)" -gt 100000
          test "$(wc -l < data/study-package/mexico-labeled.jsonl)" -gt 1000
          test "$(wc -l < data/study-package/mexico-dialogue-frequency.jsonl)" -gt 10000
          test "$(wc -l < data/study-package/wikcionario-mexico.jsonl)" -gt 1500
          test "$(wc -l < data/study-package/mexico-radio-frequency.jsonl)" -eq 6250
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import crypto from "node:crypto";
          const root="data/study-package/";
          const m=JSON.parse(fs.readFileSync(root+"mexico-radio-frequency-manifest.json","utf8"));
          const data=fs.readFileSync(root+"mexico-radio-frequency.jsonl");
          assert.equal(m.utterances,16663);
          assert.equal(m.token_total,167118);
          assert.equal(m.published_surface_tokens,6250);
          assert.equal(m.output_sha256,crypto.createHash("sha256").update(data).digest("hex"));
          assert.equal(m.license,"CC BY-SA 4.0; see CIEMPIESS-SOURCE.md");
          NODE
      - name: Upload study-export package for the external trainer
        uses: actions/upload-artifact@v4
        with:
          name: mexilex-study-data
          path: data/study-package/
          if-no-files-found: error
          retention-days: 14
