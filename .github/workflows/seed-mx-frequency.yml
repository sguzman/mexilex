name: Seed versioned Mexico film-dialogue evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-mx-frequency.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mexilex-mexican-evidence
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download exactly pinned ACTIV-ES v0.2 one-gram word frequencies
        run: |
          mkdir -p data evidence
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --output data/aes1grams.csv \
            https://raw.githubusercontent.com/francojc/activ-es/e42124efbd0c6c30fc8b6a93e5d3a1e9bc4c7e08/activ-es-v.02/wordlists/plain/aes1grams.csv
          test "$(stat -c%s data/aes1grams.csv)" -gt 3000000
          sha256sum data/aes1grams.csv
      - name: Validate Rust source before seeding evidence
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
      - name: Retain only Mexico-attested exact surface headwords from Git corpus
        run: |
          cargo run --release -- import-mx-frequency data/aes1grams.csv corpus data/frequency-rebuilt.jsonl
          test -s data/frequency-rebuilt.jsonl
          test -s data/frequency-rebuilt.manifest.json
          grep -q '"source_commit"' data/frequency-rebuilt.manifest.json
          test "$(wc -l < data/frequency-rebuilt.jsonl)" -gt 3000
          grep -q '"casa"' data/frequency-rebuilt.jsonl
          du -h data/frequency-rebuilt.jsonl
      - name: Commit derived frequency evidence separately from lexicon
        run: |
          cp data/frequency-rebuilt.jsonl evidence/activ-es-v02.jsonl
          cp data/frequency-rebuilt.manifest.json evidence/activ-es-v02.manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/activ-es-v02.jsonl evidence/activ-es-v02.manifest.json
          if git diff --cached --quiet; then
            echo "Mexican evidence unchanged"
          else
            git commit -m "data: record licensed Mexico dialogue frequency sidecar"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run site.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
