name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: node --check scripts/guard-upstream-refresh.mjs
      - run: node --check scripts/summarize-upstream-review.mjs
      - run: node --test tests/upstream-refresh.test.mjs
